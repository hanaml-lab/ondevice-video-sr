# CPU toy setting for python -m drift_vsr.demo (two training runs) and python -m drift_vsr.train (one).
threads: 1            # one CPU thread: the results do not depend on the core count, and tiny tensors gain nothing from more
width: 16
blocks_f: 2
blocks_g: 1
hr: 32
videos: 4
video_frames: 60
unroll: 6
iters_fp: 150
iters_qat: 150
lr: 0.002
gamma: 0.9
lambda_contr: 0.1
power_iters: 2
bank_horizon: 60
p_bank: 0.7
eval_frames: 2000    # a held-out stream long enough to see error accumulate, far beyond the 60 training frames
jacobian_stride: 100 # estimate the state-Jacobian norm at every 100th frame of it
seed: 0
