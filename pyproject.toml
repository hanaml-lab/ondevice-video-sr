[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "drift-vsr"
version = "0.1.0"
description = "DRIFT: drift-bounded distillation of video diffusion into integer recurrent students"
readme = "README.md"
license = { text = "Apache-2.0" }
authors = [{ name = "Manav Agarwal", email = "manav@hanaml.com" }]
requires-python = ">=3.10"
dependencies = ["torch>=2.2", "numpy>=1.24", "pyyaml>=6"]

[project.optional-dependencies]
paper = ["matplotlib>=3.7"]
dev = ["pytest>=8", "ruff>=0.5"]

[project.scripts]
drift-demo = "drift_vsr.demo:main"
drift-train = "drift_vsr.train:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "W"]

[tool.ruff.lint.per-file-ignores]
# The report's generator and figure scripts are dense numerical code: compound statements are allowed there,
# and pyflakes still applies.
"paper/*" = ["E401", "E701", "E702", "E731", "E741"]
